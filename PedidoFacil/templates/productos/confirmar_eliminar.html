{% extends "base.html" %}
{% block title %}Eliminar producto · PedidoFácil{% endblock %}
{% block content %}
<div class="card border-danger shadow-sm">
  <div class="card-body">
    <h1 class="h4">¿Eliminar este producto?</h1>
    <p>Vas a eliminar <strong>{{ object.nombre }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'producto_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
